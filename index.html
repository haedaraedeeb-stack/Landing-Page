<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./assets/css/header/header.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Urbanist:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <script src="https://kit.fontawesome.com/20be633296.js" crossorigin="anonymous"></script>
    <title>Document</title>
  </head>
  <body>
    <header>
      <nav>
        <h1>Travel</h1>
        <img src="./assets/imgs/bar.svg" alt="bar image" class="bar" />
        <i class="fa-solid fa-bars"></i>
      </nav>
      <div class="hero">
        <div class="hero-h1">
          <h1><span>Travel</span> around the world</h1>
        </div>
        <div class="background_shadow">
          <img src="./assets/imgs/happy.svg" alt="happy people image" />
          <div class="outline-circle"></div>
          <div class="half-circle"></div>
        </div>

        <div class="hero-info">
          <div class="info-text">
            Travel around the world to see the beauty of nature easily and
            safely with Travel.
          </div>
          <div class="divider"></div>
          <div class="info-title">
            <h2> We Are The Best Travel Agent</h2>
          </div>
          <div class="divider"></div>

          <div class="info-text">
            Everyone is young once, but not everyone has traveled the world!
          </div>
        </div>
      </div>
    </header>
    <main></main>
  </body>
</html>
